version: 2

models:
    - name: dim__offers
      description: One current descriptive record per offer. The grain is one row per offer_key.
      columns:
          - name: offer_key
            description: Stable source identifier for the offer.
            tests:
                [
                    not_null,
                    unique
                ]
          - name: url
            description: Source URL for the current offer listing.
          - name: title
            description: Current listing title supplied by the source.
          - name: brand
            description: Current vehicle brand supplied by the source.
          - name: model
            description: Current vehicle model supplied by the source.
          - name: year
            description: Current model year supplied by the source.
          - name: mileage_km
            description: Mileage from the latest observed offer state, in kilometres.
          - name: fuel_type
            description: Current fuel type supplied by the source.
          - name: transmission
            description: Current transmission type supplied by the source.
          - name: price_amount
            description: Price from the latest observed offer state, normalized when an exchange rate is available.
          - name: price_currency
            description: Currency of price_amount after exchange-rate normalization.
          - name: first_observed_at
            description: Timestamp of the first recorded observation.
            tests:
                [
                    not_null
                ]
          - name: last_observed_at
            description: Timestamp of the latest recorded observation.
            tests:
                [
                    not_null
                ]
          - name: observation_count
            description: Number of recorded observations for this offer, including the current one.
            tests:
                [
                    not_null
                ]

    - name: fct__offer_observations
      description: One row per observed offer state during a scrape run. The grain is one row per offer_key and observed_at.
      columns:
          - name: offer_key
            description: Foreign key to dim__offers.
            tests:
                - not_null
                - relationships:
                      arguments:
                          to: ref('dim__offers')
                          field: offer_key
          - name: observed_at
            description: Timestamp when this offer state was observed.
            tests:
                [
                    not_null
                ]
          - name: price_amount
            description: Listed price amount observed at this timestamp.
          - name: price_currency
            description: Currency of the listed price.
          - name: mileage_km
            description: Listed vehicle mileage in kilometres.
          - name: scrape_run_id
            description: Identifier of the scrape run that produced this observation.

    - name: agg__offers_by_brand
      description: Current offer counts grouped by brand.
      columns:
          - name: brand
            description: Brand from the current offer record.
          - name: offer_count
            description: Number of current offers for the brand.
            tests:
                - not_null

    - name: agg__offers_by_fuel_type
      description: Current offer counts grouped by fuel type.
      columns:
          - name: fuel_type
            description: Fuel type from the current offer record.
          - name: offer_count
            description: Number of current offers for the fuel type.
            tests:
                - not_null

    - name: agg__daily_offer_observations
      description: Daily volume and price summary for observed offer states.
      columns:
          - name: observation_date
            description: Calendar date of the offer observation.
            tests:
                - not_null
                - unique
          - name: observation_count
            description: Number of offer observations recorded on the date.
            tests:
                - not_null
          - name: distinct_offer_count
            description: Number of distinct offers observed on the date.
            tests:
                - not_null
          - name: average_price_amount
            description: Average listed price across observations on the date.

    - name: rpt__marketplace_overview
      description: Daily marketplace overview for headline inventory and scraper-activity reporting.
      columns:
          - name: observation_date
            description: Calendar date represented by the overview row.
            tests:
                - not_null
                - unique
          - name: current_offer_count
            description: Total number of offers represented in the current offer dimension.
            tests:
                - not_null
          - name: new_offer_count
            description: Number of offers first observed on this date.
            tests:
                - not_null
          - name: cumulative_offer_count
            description: Running total of offers first observed through this date.
            tests:
                - not_null
          - name: observation_count
            description: Number of offer observations collected on this date.
            tests:
                - not_null
          - name: distinct_offer_count
            description: Number of distinct offers observed on this date.
            tests:
                - not_null
          - name: average_price_amount
            description: Average listed price across observations on this date.
