version: 2

sources:
    - name: raw
      schema: beamer_warehouse
      tables:
          - name: offers_observations
            identifier: raw_offers_observations
            description: Offer observations copied from DuckLake into ClickHouse.
            columns:
                - name: source_offer_id
                  tests:
                      [
                          not_null
                      ]
                - name: observed_at
                  tests:
                      [
                          not_null
                      ]
          - name: currency_rates
            identifier: raw_currency_rates
            description: Daily average foreign exchange rates published by NBP.
            columns:
                - name: effective_date
                  tests:
                      [
                          not_null
                      ]
                - name: base_currency
                  tests:
                      [
                          not_null
                      ]
                - name: quote_currency
                  tests:
                      [
                          not_null
                      ]
                - name: rate_to_pln
                  tests:
                      [
                          not_null
                      ]
