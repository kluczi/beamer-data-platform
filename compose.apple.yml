# Compose file for Container-Compose + Apple's `container` CLI (macOS 26+).
# Start it with: container-compose --file compose.apple.yml up --build --detach
name: beamer

services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Apple Container named volumes contain lost+found at their root.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [beamer]

  minio:
    image: docker.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks: [beamer]

  create-bucket:
    image: docker.io/minio/mc:latest
    env_file: .env
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      mc alias set local http://minio.beamer:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}";
      until mc ready local >/dev/null 2>&1; do sleep 1; done;
      mc mb -p "local/${MINIO_BUCKET}" || true
    networks: [beamer]

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:latest
    mem_limit: 4g
    environment:
      # Container-Compose does not expand Compose's ${VAR:-default} form here.
      CLICKHOUSE_DB: beamer_warehouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9002:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks: [beamer]

  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    user: "0:0"
    environment:
      CLICKHOUSE_URL: http://clickhouse.beamer:8123
      CONNECTION_NAME: Beamer ClickHouse
    ports:
      - "127.0.0.1:3488:3488"
    volumes:
      - ch_ui_data:/app/data
    depends_on:
      clickhouse:
        condition: service_started
    networks: [beamer]

  duckdb:
    image: docker.io/library/python:3.12-slim
    env_file: .env
    environment:
      POSTGRES_HOST: postgres.beamer
      MINIO_ENDPOINT: minio.beamer:9000
    depends_on:
      postgres:
        condition: service_started
      create-bucket:
        # Container-Compose cannot report an Apple one-shot container's exit status.
        condition: service_started
    volumes:
      - ./scripts:/app/scripts
    working_dir: /app
    command: sleep infinity
    networks: [beamer]

  scraper:
    build:
      context: ./services/scraper
    env_file: .env
    environment:
      POSTGRES_HOST: postgres.beamer
      MINIO_ENDPOINT: minio.beamer:9000
      CLICKHOUSE_HOST: clickhouse.beamer
    depends_on:
      postgres:
        condition: service_started
      create-bucket:
        # Container-Compose cannot report an Apple one-shot container's exit status.
        condition: service_started
      clickhouse:
        condition: service_started
    volumes:
      - ./services/scraper/src:/app/src
    command: ["python", "-m", "src.main"]
    networks: [beamer]

  discord-alerts:
    build:
      context: ./services/discord
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse.beamer
    depends_on:
      clickhouse:
        condition: service_started
    networks: [beamer]

  airflow:
    build:
      context: .
      dockerfile: orchestration/airflow/Dockerfile
    image: beamer-airflow:local
    mem_limit: 4g
    user: "0:0"
    env_file: .env
    command:
      - bash
      - -ec
      - >-
        chown 50000:0 /opt/airflow;
        python -c 'import json, os; json.dump({os.environ["AIRFLOW_ADMIN_USERNAME"]: os.environ["AIRFLOW_ADMIN_PASSWORD"]}, open("/opt/airflow/simple_auth_manager_passwords.json.generated", "w"))';
        chown 50000:0 /opt/airflow/simple_auth_manager_passwords.json.generated;
        chmod 600 /opt/airflow/simple_auth_manager_passwords.json.generated;
        exec runuser -u airflow -- airflow standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USERNAME}:admin"
      POSTGRES_HOST: postgres.beamer
      MINIO_ENDPOINT: minio.beamer:9000
      CLICKHOUSE_HOST: clickhouse.beamer
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - airflow_data:/opt/airflow
      - ./orchestration/airflow/dags:/opt/airflow/dags
      - ./dbt/reports/.evidence:/opt/beamer/dbt/reports/.evidence
    depends_on:
      postgres:
        condition: service_started
      create-bucket:
        condition: service_started
      clickhouse:
        condition: service_started
    networks: [beamer]

networks:
  beamer:

volumes:
  postgres_data:
  minio_data:
  clickhouse_data:
  ch_ui_data:
  airflow_data:
