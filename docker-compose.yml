services:
    postgres:
        image: postgres:16
        container_name: beamer_postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    minio:
        image: minio/minio:latest
        container_name: beamer_minio
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test:
                [
                    "CMD",
                    "mc",
                    "ready",
                    "local"
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    create-bucket:
        image: minio/mc:latest
        container_name: beamer_create_bucket
        depends_on:
            minio:
                condition: service_healthy
        env_file:
            - .env
        entrypoint:
            >
            /bin/sh -c "
            mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
            mc mb -p local/$${MINIO_BUCKET} || true;
            mc ls local;
            "

    duckdb:
        image: python:3.12-slim
        container_name: beamer_duckdb
        depends_on:
            postgres:
                condition: service_healthy
            create-bucket:
                condition: service_completed_successfully
        env_file:
            - .env
        volumes:
            - ./scripts:/app/scripts
        working_dir: /app
        command: sleep infinity

    clickhouse:
        image: clickhouse/clickhouse-server:latest
        container_name: beamer_clickhouse
        environment:
            CLICKHOUSE_DB: ${CLICKHOUSE_DB:-beamer_warehouse}
            CLICKHOUSE_USER: ${CLICKHOUSE_USER}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
        ports:
            - "8123:8123"
            - "9002:9000"
        volumes:
            - clickhouse_data:/var/lib/clickhouse
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "clickhouse-client --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} --query 'select 1'"
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    ch-ui:
        image: ghcr.io/caioricciuti/ch-ui:latest
        container_name: beamer_ch_ui
        user: "0:0"
        environment:
            CLICKHOUSE_URL: http://clickhouse:8123
            CONNECTION_NAME: Beamer ClickHouse
        ports:
            - "127.0.0.1:3488:3488"
        volumes:
            - ch_ui_data:/app/data
        depends_on:
            clickhouse:
                condition: service_healthy

    scraper:
        build:
            context: ./services/scraper
        container_name: beamer_scraper
        env_file:
            - .env
        depends_on:
            clickhouse:
                condition: service_healthy
        volumes:
            - ./services/scraper/src:/app/src
        command:
            [
                "python",
                "-m",
                "src.main"
            ]
    discord_alerts:
        build:
            context: ./services/discord
        container_name: beamer_discord_alerts
        env_file:
            - .env
        depends_on:
            clickhouse:
                condition: service_healthy
        profiles:
            - alerts

    airflow:
        build:
            context: .
            dockerfile: orchestration/airflow/Dockerfile
        image: beamer-airflow:local
        mem_limit: 4g
        container_name: beamer_airflow
        user: "0:0"
        env_file:
            - .env
        command:
            - bash
            - -ec
            - >-
              chown 50000:0 /opt/airflow;
              python -c 'import json, os; json.dump({os.environ["AIRFLOW_ADMIN_USERNAME"]: os.environ["AIRFLOW_ADMIN_PASSWORD"]}, open("/opt/airflow/simple_auth_manager_passwords.json.generated", "w"))';
              chown 50000:0 /opt/airflow/simple_auth_manager_passwords.json.generated;
              chmod 600 /opt/airflow/simple_auth_manager_passwords.json.generated;
              exec runuser -u airflow -- airflow standalone
        environment:
            AIRFLOW__CORE__LOAD_EXAMPLES: "false"
            AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
            AIRFLOW__CORE__PARALLELISM: "4"
            AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USERNAME}:admin"
            POSTGRES_HOST: postgres
            MINIO_ENDPOINT: minio:9000
            CLICKHOUSE_HOST: clickhouse
        ports:
            - "127.0.0.1:8080:8080"
        volumes:
            - airflow_data:/opt/airflow
            - ./orchestration/airflow/dags:/opt/airflow/dags
            - ./dbt/reports/.evidence:/opt/beamer/dbt/reports/.evidence
            - ./.env:/opt/beamer/.env:ro
        depends_on:
            postgres:
                condition: service_healthy
            create-bucket:
                condition: service_completed_successfully
            clickhouse:
                condition: service_healthy

volumes:
    postgres_data:
    minio_data:
    clickhouse_data:
    ch_ui_data:
    airflow_data:
