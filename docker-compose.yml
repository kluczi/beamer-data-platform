services:
    postgres:
        image: postgres:16
        container_name: beamer_postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    minio:
        image: minio/minio:latest
        container_name: beamer_minio
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test:
                [
                    "CMD",
                    "mc",
                    "ready",
                    "local"
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    create-bucket:
        image: minio/mc:latest
        container_name: beamer_create_bucket
        depends_on:
            minio:
                condition: service_healthy
        env_file:
            - .env
        entrypoint:
            >
            /bin/sh -c "
            mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
            mc mb -p local/$${MINIO_BUCKET} || true;
            mc ls local;
            "

    duckdb:
        image: python:3.12-slim
        container_name: beamer_duckdb
        depends_on:
            postgres:
                condition: service_healthy
            create-bucket:
                condition: service_completed_successfully
        env_file:
            - .env
        volumes:
            - ./scripts:/app/scripts
        working_dir: /app
        command: sleep infinity

    clickhouse:
        image: clickhouse/clickhouse-server:latest
        container_name: beamer_clickhouse
        environment:
            CLICKHOUSE_DB: ${CLICKHOUSE_DB:-beamer_warehouse}
            CLICKHOUSE_USER: ${CLICKHOUSE_USER}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
        ports:
            - "8123:8123"
            - "9002:9000"
        volumes:
            - clickhouse_data:/var/lib/clickhouse
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "clickhouse-client --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    ch-ui:
        image: ghcr.io/caioricciuti/ch-ui:latest
        container_name: beamer_ch_ui
        user: "0:0"
        environment:
            CLICKHOUSE_URL: http://clickhouse:8123
            CONNECTION_NAME: Beamer ClickHouse
        ports:
            - "127.0.0.1:3488:3488"
        volumes:
            - ch_ui_data:/app/data
        depends_on:
            clickhouse:
                condition: service_healthy

    scraper:
        build:
            context: ./services/scraper
        container_name: beamer_scraper
        env_file:
            - .env
        depends_on:
            clickhouse:
                condition: service_healthy
        volumes:
            - ./services/scraper/src:/app/src
        command:
            [
                "python",
                "-m",
                "src.main"
            ]

volumes:
    postgres_data:
    minio_data:
    clickhouse_data:
    ch_ui_data:
